name: Run doxygen

on:
  pull_request:
  push:
    branches: [main]

env:
  LLVM_VERSION: "22"

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          packages: doxygen graphviz

      # Minimal configuration to run doxygen only.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMLIR_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/mlir"
          -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
          -DLIBADALANG_INCLUDE_DIR=/tmp/not/needed/to/run/doxygen

      - name: Run the doxygen target
        run: |
          # Doxygen 1.9.8 (current ubuntu-latest) treats the leading `::` on the
          # generated op doc's external mlir::/llvm:: names as explicit link
          # requests and errors when they don't resolve. Strip the leading `::`
          # so they become auto-links (which fail silently).
          # TODO: remove once ubuntu ships a newer Doxygen that no longer warns
          # on these external references.
          echo "FILTER_PATTERNS += \"*/AdaOps.md=sed -e 's|::mlir::|mlir::|g' -e 's|::llvm::|llvm::|g'\"" >> build/docs/Doxyfile
          cmake --build build --target doxygen
