name: Run doxygen and deploy documentation

on:
  pull_request:
  push:
    branches: [main]

# Cancel the runs a newer push to the same branch or PR supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "22"

jobs:
  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install tools
        uses: ./.github/actions/install-tools
        with:
          llvm-version: ${{ env.LLVM_VERSION }}
          packages: doxygen graphviz

      # Minimal configuration to run doxygen only.
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DMLIR_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/mlir"
          -DLLVM_DIR="/usr/lib/llvm-$LLVM_VERSION/lib/cmake/llvm"
          -DLALVM_TOOLS_ONLY=ON

      - name: Run the doxygen target
        run: |
          # Doxygen 1.9.8 (current ubuntu-latest) treats the leading `::` on the
          # generated op doc's external mlir::/llvm:: names as explicit link
          # requests and errors when they don't resolve. Strip the leading `::`
          # so they become auto-links (which fail silently).
          # TODO: remove once ubuntu ships a newer Doxygen that no longer warns
          # on these external references.
          echo "FILTER_PATTERNS += \"*/AdaOps.md=sed -e 's|::mlir::|mlir::|g' -e 's|::llvm::|llvm::|g'\"" >> build/docs/Doxyfile
          cmake --build build --target doxygen

      - name: Upload the documentation as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/docs/html

  # Publish the documentation built from main on GitHub Pages.
  deploy:
    needs: doxygen
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment half way.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
